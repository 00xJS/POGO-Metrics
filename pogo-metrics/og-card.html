<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image render source — POGO Metrics (internal)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1200">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css?v=20260811e">
<style>
  html, body { margin:0; padding:0; }
  body {
    width:1200px; height:630px; overflow:hidden; position:relative;
    background:
      radial-gradient(760px 520px at 15% -10%, rgba(232,121,43,.28), transparent 62%),
      radial-gradient(700px 480px at 90% 0%, rgba(194,62,140,.22), transparent 62%),
      var(--bg);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 68px; box-sizing:border-box;
  }
  .wordmark { position:absolute; top:52px; left:68px; display:flex; align-items:center; gap:12px;
    font-weight:800; font-size:30px; color:var(--ink); }
  h1 { font-size:74px; font-weight:800; letter-spacing:-.025em; line-height:1.08; margin:0 0 26px; }
  h1 .w { color:#fff; }
  h1 .y { background:linear-gradient(96deg,var(--accent2),var(--orange));
          -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 .t { color:var(--accent); }
  p { font-size:27px; color:var(--ink-dim); margin:0 0 34px; max-width:820px; line-height:1.45; }
  .chip { display:inline-flex; align-items:center; gap:11px; align-self:flex-start;
    background:rgba(61,220,132,.10); border:1px solid rgba(61,220,132,.42);
    color:var(--live); border-radius:999px; padding:13px 24px;
    font-family:var(--mono); font-size:19px; font-weight:700; letter-spacing:.06em; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--live); }
  .url { position:absolute; bottom:52px; right:68px; font-family:var(--mono);
    font-size:21px; font-weight:600; color:var(--ink-faint); }
</style>
</head>
<body>
  <div class="wordmark"><span class="pokeball-dot"></span> POGO Metrics</div>
  <h1><span class="w">Your</span> <span class="y">Pokémon&nbsp;GO</span><br><span class="t">journey, visualized.</span></h1>
  <p>A private, in-browser dashboard built from your official Niantic data export.</p>
  <div class="chip"><span class="dot"></span>100% PRIVATE · NOTHING IS UPLOADED</div>
  <div class="url">pogo-metrics.netlify.app</div>
</body>
</html>
