[build]
  # 100% static — all parsing happens client-side in the browser,
  # so there is no build step and no server.
  publish = "pogo-metrics"
  command = ""

# ── security headers ────────────────────────────────────────────────────────
# The CSP makes the privacy promise browser-enforced, not just true: with
# connect-src 'self', no script — ours, a tampered vendored lib, or an
# injected one — can fetch, XHR, WebSocket or beacon parsed export data
# off-origin. Say it that precisely: connect-src governs those APIs, not
# navigation, and this is a claim people are invited to check.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# ── caching ────────────────────────────────────────────────────────────────
# vendor/ holds pinned library builds and textures, so repeat visitors skip ~3MB
# of revalidation round-trips. HTML/js/css stay on Netlify's revalidating default
# and use ?v= query busting.
#
# THE RULE THIS DEPENDS ON: never overwrite a file inside vendor/ — an upgrade
# must land under a new filename. Only the woff2 files are content-hashed, so
# nothing enforces this but the reader of this comment. Break it and there is no
# recovery: a year of `immutable` pins the old bytes in the browser's HTTP
# cache, and sw.js serves /vendor/ cache-first, so even bumping the service
# worker VERSION doesn't help — the new cache misses, fetches, and is handed the
# stale copy right back.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The sample export. Crawlers must be able to FETCH these (demo.html builds
# itself from them, and robots.txt used to block that, so the indexed live
# example was a loading spinner) but the raw data files should not themselves
# appear in results — which is what noindex does and Disallow cannot.
#
# The folder is `sample-export/`, not `demo/`. Netlify serves pages at
# extensionless URLs, so a folder named demo shares its path with demo.html:
# `for = "/demo/*"` matched the PAGE at /demo as well as the data, and quietly
# noindexed the one page the robots.txt block below goes out of its way to keep
# crawlable. Never name a data folder after a page.
[[headers]]
  for = "/sample-export/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

# The Trainer Model cohort data — same reasoning and same pattern as the sample
# export above (and /data/ likewise shares no name with any page):
# crawlers may fetch it (trainer-model.html builds itself from these files),
# but the raw JSON should never surface in search results itself.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

# Everything else that lives in the publish folder without being part of the
# site: the share-card render sources, the repo README, the local dev server and
# the build tools. All are deliberately readable — this project invites people to
# check its work — they just shouldn't turn up as search results.
[[headers]]
  for = "/og-card*.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/README.md"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/static-server.mjs"
  [headers.values]
    X-Robots-Tag = "noindex"
